image: python:3.11-slim

# FMOFP Bitbucket Pipelines CI
# Mirrors .github/workflows/ci.yml — keep the two in sync when editing either.
#
# Reconciled August 2026 (production-readiness follow-up): this file had
# drifted from the GitHub workflow it claims to mirror —
#   * it hardcoded PyQt6==6.7.* while requirements.txt (the declared single
#     source of truth) pins 6.8.1, so Bitbucket runs tested a different Qt
#     than the one that ships;
#   * it omitted scipy and click entirely — the two dependencies whose
#     absence was already found to silently break weather-radar analysis
#     and to block the whole app from importing, respectively;
#   * its lint step still swallowed its own exit code with `|| true` and
#     used the broader F8 selector, both of which the GitHub workflow had
#     already fixed.
# All steps now install from B20SS/requirements.txt, run the boot smoke
# test first (see ci_test_boot_smoke.py for the Aug 2026 boot-deadlock
# incident that motivates it), then the full aggregating runner
# (run_all_tests.py), matching the GitHub workflow exactly.

definitions:
  yaml-anchors:
    - &test-script
        - apt-get update -qq
        - apt-get install -y --no-install-recommends
            libgl1 libglib2.0-0 libdbus-1-3 libegl1
            libxkbcommon0 libfontconfig1 libfreetype6 xvfb
        - pip install --upgrade pip
        - pip install -r B20SS/requirements.txt
        - export PYTHONPATH="$PYTHONPATH:$(pwd)/B20SS"
        - export QT_QPA_PLATFORM=offscreen
        - cd B20SS && python FMOFP/Tests/ci_test_boot_smoke.py
        - python FMOFP/Tests/run_all_tests.py

pipelines:
  default:
    - parallel:
        - step:
            name: Test Suite (Python 3.10)
            image: python:3.10-slim
            script: *test-script

        - step:
            name: Test Suite (Python 3.11)
            image: python:3.11-slim
            script: *test-script

        - step:
            name: Test Suite (Python 3.12)
            image: python:3.12-slim
            script: *test-script

        - step:
            name: Test Suite (Python 3.13)
            image: python:3.13-slim
            script: *test-script

        - step:
            name: Test Suite (Python 3.14)
            image: python:3.14-slim
            script: *test-script

        - step:
            # Matches the `cpp` job in .github/workflows/ci.yml: the C++ flight
            # software (B20SS/ofp) built with -Werror, its tests, cppcheck, and
            # the same build again under ASan + UBSan. The ICD check first,
            # since the C++ is generated from it.
            name: C++ OFP (GCC, cppcheck, ASan/UBSan)
            image: ubuntu:24.04
            script:
              - export DEBIAN_FRONTEND=noninteractive
              - apt-get update -qq
              - apt-get install -y --no-install-recommends
                  g++ cmake ninja-build libgtest-dev cppcheck gcovr python3 python3-numpy python3-scipy git
                  python3-pyqt6 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
              - git config --global --add safe.directory '*'
              - python3 B20SS/icd/tools/icd_tool.py check
              - python3 B20SS/icd/tools/icd_tool.py render
              - git diff --exit-code -- B20SS/icd/ICD_TABLES.md
              - cd B20SS/ofp
              - cmake --preset linux-gcc
              - cmake --build --preset linux-gcc
              - ctest --preset linux-gcc
              - cmake --build --preset linux-gcc --target cppcheck
              - cd ../..
              - python3 B20SS/icd/tools/icd_tool.py gen-py
              - git diff --exit-code -- B20SS/fmofp_bus/icd
              - cd B20SS
              - export FMOFP_BC=$(pwd)/ofp/build/linux-gcc/bc/fmofp_bc
              - export FMOFP_FCS=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_fcs
              - export FMOFP_NAV=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_nav
              - export FMOFP_NAV_TOOL=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_nav_tool
              - export FMOFP_FMS=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_fms
              - export FMOFP_RADAR=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_radar
              - export FMOFP_RADAR_TOOL=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_radar_tool
              - export FMOFP_ENGINE=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_engine
              - export FMOFP_ENGINE_TOOL=$(pwd)/ofp/build/linux-gcc/partitions/fmofp_engine_tool
              - export QT_QPA_PLATFORM=offscreen
              - python3 -m unittest discover -s fmofp_bus/tests -t . -v
              - cd ofp
              - cmake --preset linux-asan
              - cmake --build --preset linux-asan
              - ctest --preset linux-asan

        - step:
            name: Lint (ruff)
            image: python:3.11-slim
            script:
              # Matches .github/workflows/ci.yml: F821-focused selector,
              # and NO `|| true` — a lint job that can't fail gates nothing.
              # `--ignore F811` removed in step with the GitHub workflow
              # (story C10.1) — see that file for why.
              - pip install ruff
              - ruff check B20SS/FMOFP
                  --select E9,F821,F7,F6
                  --exclude B20SS/FMOFP/Tests
