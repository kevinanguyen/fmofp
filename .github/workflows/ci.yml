name: FMOFP CI

on:
  push:
    # port/** is the C++ port's working branch; running CI there gives the
    # C++ job feedback long before anything reaches main.
    branches: [ main, 'port/**' ]
  pull_request:
    branches: [ main ]
  # Manual runs from the Actions tab or `gh workflow run`, for re-checking a
  # branch without pushing to it.
  workflow_dispatch:

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libfreetype6 \
            xvfb

      - name: Install Python dependencies
        # Install from B20SS/requirements.txt instead of hardcoding versions
        # here. This file previously hardcoded PyQt6==6.7.* / PyQt6-Qt6==6.7.*,
        # which drifted from the PyQt6-6.8.1 / PyQt6_Qt6-6.8.2 wheels actually
        # bundled in B20SS/PyQt6/ and B20SS/python packages/ for offline
        # installs (see production readiness punch list, item 1). CI was
        # testing against a different Qt6 version than what ships to users.
        # requirements.txt is now the single source of truth that both CI
        # and install.py read from, so they can no longer drift apart.
        run: |
          python -m pip install --upgrade pip
          pip install -r B20SS/requirements.txt

      - name: Add B20SS to PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/B20SS" >> $GITHUB_ENV

      # The boot smoke test runs FIRST and as its own step so that a boot
      # regression is unmissable in the CI UI. Added August 2026 after
      # commit 8f37be6 shipped a SystemStateManager __new__/_initialize
      # self-deadlock that made `import FMOFP.core.system_manager` (and
      # therefore Main.py) hang forever — while CI stayed green, because
      # no CI test exercised the boot path.
      - name: Boot smoke test (import real entry path under watchdog)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd B20SS
          python FMOFP/Tests/ci_test_boot_smoke.py

      # Single aggregating runner replaces the previous per-suite steps
      # (which covered only 7 of the repo's test files). Runs every
      # standalone-safe suite, subprocess-isolated with per-suite watchdog
      # timeouts, and fails the job if ANY suite fails, times out, or
      # crashes. See run_all_tests.py's docstring for which suites are
      # excluded and why (CLI-harness-only tests, interactive GUI test,
      # profiler).
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd B20SS
          python FMOFP/Tests/run_all_tests.py

  test-windows:
    name: Test Suite on Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest

    # Why this leg exists: B10 fixed the offline bundled-wheel install, and
    # nothing in CI exercised it. The ubuntu legs cannot -- WHEEL_DIRS resolves
    # empty there -- so install.py's Windows path had only ever been checked by
    # hand. The suite itself was also unrunnable on Windows until Sept 2026
    # (cp1252 console encoding, a hardcoded POSIX path in test_data_root, an
    # unbounded shutdown wait, and a status-word race); it now passes 28/28, so
    # this leg starts green and guards all of that from regressing.
    #
    # Two versions rather than the full five: 3.10 is install.py's MIN_PYTHON
    # and what the project is developed against, 3.13 catches newer-asyncio
    # differences. Windows runners are slower and the full suite takes ~6 min,
    # so five would cost more than it tells us.
    #
    # Expect the occasional red from the live GUI suites -- they have a known
    # nondeterministic failure rate around 1 in 6 full runs. Left as a real
    # signal rather than hidden behind continue-on-error; re-run to confirm.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No system-package step: on Windows the PyQt6 wheels carry their own Qt
      # runtime, so there is no libgl1/xvfb equivalent to install.
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r B20SS/requirements.txt

      # No PYTHONPATH step either: run_all_tests.run_suite and
      # ci_test_boot_smoke.run_check both put the working directory on the
      # child's PYTHONPATH themselves, verified with PYTHONPATH unset. The
      # ubuntu legs set it anyway, which is harmless but not required.
      - name: Boot smoke test (import real entry path under watchdog)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd B20SS
          python FMOFP/Tests/ci_test_boot_smoke.py

      - name: Run full test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd B20SS
          python FMOFP/Tests/run_all_tests.py

  # The C++ flight software (B20SS/ofp) and the ICD it is generated from. Two
  # legs: a plain GCC build with cppcheck, and the same build under
  # AddressSanitizer + UndefinedBehaviorSanitizer, which MinGW cannot provide on
  # the Windows development machines. Both build with -Werror; see
  # B20SS/ofp/CLAUDE.md for the rules the flags enforce.
  cpp:
    name: C++ OFP (${{ matrix.preset }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-asan]

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libgtest-dev cppcheck gcovr python3

      # The XML is the single source of every bus message. `check` enforces the
      # ICD's own rules; the render + diff fails the build if someone changed
      # the XML without regenerating ICD_TABLES.md.
      - name: Check the ICD and its rendered tables
        run: |
          python3 B20SS/icd/tools/icd_tool.py check
          python3 B20SS/icd/tools/icd_tool.py render
          git diff --exit-code -- B20SS/icd/ICD_TABLES.md

      - name: Configure
        working-directory: B20SS/ofp
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: B20SS/ofp
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: B20SS/ofp
        run: ctest --preset ${{ matrix.preset }}

      - name: cppcheck
        if: matrix.preset == 'linux-gcc'
        working-directory: B20SS/ofp
        run: cmake --build --preset ${{ matrix.preset }} --target cppcheck

      # The Python side of the bus (B20SS/fmofp_bus): its generated layouts
      # must match the XML, and its terminal must satisfy the real C++ bus
      # controller built above.
      - name: Python bus library
        if: matrix.preset == 'linux-gcc'
        env:
          FMOFP_BC: ${{ github.workspace }}/B20SS/ofp/build/linux-gcc/bc/fmofp_bc
          FMOFP_FCS: ${{ github.workspace }}/B20SS/ofp/build/linux-gcc/partitions/fmofp_fcs
          FMOFP_NAV: ${{ github.workspace }}/B20SS/ofp/build/linux-gcc/partitions/fmofp_nav
          FMOFP_NAV_TOOL: ${{ github.workspace }}/B20SS/ofp/build/linux-gcc/partitions/fmofp_nav_tool
        run: |
          python3 B20SS/icd/tools/icd_tool.py gen-py
          git diff --exit-code -- B20SS/fmofp_bus/icd
          cd B20SS
          python3 -m unittest discover -s fmofp_bus/tests -t . -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff (errors only)
        # NOTE (production readiness re-analysis, August 2026): this step's
        # own output was piped through `|| true`, so it has never once been
        # able to fail a CI run, regardless of what ruff found -- a lint job
        # that can't fail isn't actually gating anything. Running this same
        # check manually against the repo for the first time this session
        # found 70 real F821 (undefined-name) bugs across 13 files (missing
        # imports, never-extracted variables -- the exact "NameError when
        # this code path executes" class of bug this session has repeatedly
        # found and fixed via live testing) plus 4 duplicate-dict-key
        # findings, all silently accumulating behind this swallowed exit
        # code the whole time. All 70+4 are now fixed (one, a reference to a
        # SchemaManager class that was never implemented anywhere in dead,
        # unreachable code, is deliberately left as a documented exception
        # rather than fabricated). Narrowed --select from the F8 prefix down
        # to F821 specifically (dropping F841/unused-variable and other F8x
        # codes not yet triaged, to avoid this becoming a large unrelated
        # cleanup) and removed `|| true`, so a future regression of this
        # kind will actually fail CI instead of silently passing.
        #
        # Story C10.1 (September 2026): `--ignore F811` removed. That flag
        # suppressed exactly the rule that catches a name being defined twice,
        # and it was hiding 17 real redefinitions -- including
        # get_command_type/is_command_type defined twice in
        # display_message_types.py with DIFFERENT bodies (the richer one dead),
        # an entire duplicated enum+class block in legend_manager.py, and two
        # duplicated push functions in radar_to_display_bridge.py. All are now
        # removed and the selector passes clean without the flag, so keeping it
        # would only let the same class of defect return unseen.
        run: |
          ruff check B20SS/FMOFP \
            --select E9,F821,F7,F6 \
            --exclude B20SS/FMOFP/Tests
